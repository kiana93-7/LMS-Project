{% extends '_base.html' %}
{% block page_title %}حذف مدرک{% endblock %}

{% block content %}
<style>
    /* انیمیشن ورود کارت */
    @keyframes popIn {
        0% { opacity: 0; transform: scale(0.9); }
        100% { opacity: 1; transform: scale(1); }
    }

    /* انیمیشن لرزش آیکون هشدار */
    @keyframes shake {
        0%, 100% { transform: rotate(0); }
        20% { transform: rotate(-10deg); }
        40% { transform: rotate(10deg); }
        60% { transform: rotate(-5deg); }
        80% { transform: rotate(5deg); }
    }

    .delete-card {
        background: #ffffff;
        border-radius: 24px;
        border: 1px solid #FFCDD2;
        box-shadow: 0 15px 40px rgba(211, 47, 47, 0.08);
        padding: 40px;
        text-align: center;
        position: relative;
        overflow: hidden;
        animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* هاله قرمز ملایم در پس‌زمینه کارت */
    .delete-card::before {
        content: '';
        position: absolute;
        top: -50%; left: -50%;
        width: 200%; height: 200%;
        background: radial-gradient(circle, rgba(255, 205, 210, 0.3) 0%, transparent 60%);
        z-index: 0;
        pointer-events: none;
    }

    .delete-card > * {
        position: relative;
        z-index: 1;
    }

    /* باکس آیکون هشدار */
    .warning-icon-box {
        width: 90px;
        height: 90px;
        background: #FFF5F5;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 25px;
        border: 4px solid #FFEBEE;
        color: #D32F2F;
        font-size: 3rem;
        box-shadow: 0 10px 20px rgba(211, 47, 47, 0.1);
    }

    .delete-card:hover .warning-icon-box {
        animation: shake 0.5s ease-in-out;
    }

    /* عنوان */
    .delete-title {
        font-weight: 800;
        color: #223A5E;
        font-size: 1.5rem;
        margin-bottom: 15px;
    }

    /* متن توضیحات */
    .delete-text {
        color: #6E9ECC;
        font-size: 1rem;
        line-height: 1.8;
        margin-bottom: 30px;
    }

    .delete-text strong {
        color: #D32F2F;
        background: #FFF5F5;
        padding: 2px 8px;
        border-radius: 6px;
    }

    /* دکمه‌ها */
    .btn-cancel {
        background: #F8FBFF;
        color: #355982;
        border: 2px solid #D0E1F2;
        border-radius: 12px;
        padding: 12px 25px;
        font-weight: 700;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
    }

    .btn-cancel:hover {
        background: #E3F2FD;
        border-color: #9FC0E3;
        color: #223A5E;
        transform: translateY(-2px);
    }

    .btn-confirm-delete {
        background: linear-gradient(135deg, #EF5350 0%, #D32F2F 100%);
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 12px 30px;
        font-weight: 800;
        font-size: 1.05rem;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 5px 15px rgba(211, 47, 47, 0.3);
    }

    .btn-confirm-delete:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 10px 25px rgba(211, 47, 47, 0.4);
        color: #fff;
    }
</style>

<div class="container mt-5 mb-5 d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-8 col-lg-6">
        <div class="delete-card">
            <!-- آیکون -->
            <div class="warning-icon-box">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>

            <!-- عنوان -->
            <h3 class="delete-title">حذف مدرک</h3>

            <!-- متن -->
            <p class="delete-text">
                آیا از حذف مدرک <strong>{{ cert.CertificationTitle }}</strong> مطمئن هستید؟<br>
                این عمل قابل بازگشت نیست و تمام اطلاعات مرتبط با این مدرک پاک خواهد شد.
            </p>

            <!-- فرم و دکمه‌ها -->
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'certificate_list' %}" class="btn-cancel">
                        <i class="bi bi-arrow-right me-1"></i> انصراف
                    </a>
                    <button type="submit" class="btn-confirm-delete">
                        <i class="bi bi-trash3 me-2"></i> بله، حذف کن
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
