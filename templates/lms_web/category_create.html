{% extends '_base.html' %}
{% block page_title %}ایجاد/ویرایش دسته‌بندی{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header text-white text-center py-3" style="background: linear-gradient(135deg,#223A5E 0%,#355982 100%);">
                <h4 class="mb-0"><i class="bi bi-tag"></i> اطلاعات دسته‌بندی</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary" for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
                        </div>
                    {% endfor %}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary rounded-pill">ذخیره</button>
                        <a href="{% url 'category_list' %}" class="btn btn-outline-secondary rounded-pill">بازگشت</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
